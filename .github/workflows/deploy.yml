name: Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build (Prisma client + standalone + bot bundle)
        run: |
          npx prisma generate
          npm run build
          cp -r node_modules/.prisma .next/standalone/node_modules/ 2>/dev/null || true
          npm run build:bot

      - name: Copy Build Artifacts to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: ".next/standalone,.next/static,public,prisma,package.json,ecosystem.config.js"
          target: "~/budget-tracker"
          strip_components: 0

      - name: Assemble, Migrate, and (Re)start PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            # Load Node/npm/npx/pm2 into this non-interactive shell (nvm installs aren't on PATH otherwise)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            # Fallback to common global locations if not using nvm
            command -v npx >/dev/null 2>&1 || export PATH="/usr/local/bin:/usr/bin:$PATH"

            cd ~/budget-tracker

            # 1) Place static + public inside standalone (clean first to avoid nested dirs on redeploy)
            rm -rf .next/standalone/.next/static .next/standalone/public
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/

            # 2) Apply schema to the PERSISTENT prod DB (path from the persistent .env)
            export DATABASE_URL="$(grep '^DATABASE_URL=' "$HOME/budget-data/.env" | cut -d= -f2- | tr -d '"')"
            npx --yes prisma@6.19.3 db push --schema prisma/schema.prisma --skip-generate

            # 3) Start or reload both services with fresh env
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
